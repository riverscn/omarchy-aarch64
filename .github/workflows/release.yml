name: Publish AArch64 release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*-aarch64.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release from the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Omarchy AArch64 ${RELEASE_TAG#v}"
